<!doctype html>
<html lang="es-BO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F3864" />
    <meta name="description" content="AmazoQuiz UAP — evaluaciones gamificadas de la Universidad Amazónica de Pando" />
    <title>AmazoQuiz UAP</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita parpadeo)
      try {
        var t = localStorage.getItem('aq-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
