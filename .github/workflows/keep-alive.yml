name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso.
# Esta tarea hace una consulta liviana dos veces por semana para evitarlo.
on:
  schedule:
    - cron: '17 13 * * 1,4' # lunes y jueves, 09:17 hora de Bolivia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          # Lee la URL y la clave pública desde .env.example
          URL=$(grep '^VITE_SUPABASE_URL=' .env.example | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env.example | cut -d= -f2-)
          # Fase 1 agregará la función keep_alive() que toca la base de datos.
          curl -s -o /dev/null -w "auth: %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -s -o /dev/null -w "rest: %{http_code}\n" -X POST "$URL/rest/v1/rpc/keep_alive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' 
