name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso.
# Esta tarea hace una consulta liviana dos veces por semana para evitarlo.
on:
  schedule:
    - cron: '17 13 * * 1,4' # lunes y jueves, 09:17 hora de Bolivia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase aún no está configurado (Fase 1). Nada que hacer."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $code"
